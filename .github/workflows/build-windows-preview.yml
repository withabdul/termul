name: Build Windows Preview

on:
  push:
    branches:
      - preview/win-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 Preview
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Check figcraft pin
        run: bun scripts/canvas/check-figcraft-pin.mjs

      - name: Fetch and verify figcraft bundle (canvas/bundle/)
        run: bun scripts/canvas/fetch-figcraft-bundle.mjs

      - name: Build Windows NSIS installer
        run: bun run tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.conf.prod.json --config src-tauri/tauri.conf.preview.json

      - name: Upload Windows preview artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: troupe-windows-preview
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/troupe.exe
          if-no-files-found: error
          retention-days: 7
